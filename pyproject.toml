[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "engineering-drawing-cu-diff"
version = "0.1.0"
description = "Evidence-grounded engineering drawing comparison with Azure Content Understanding"
requires-python = ">=3.11"
dependencies = ["PyMuPDF>=1.28,<2"]

[project.optional-dependencies]
graphics = ["numpy>=1.26,<3", "opencv-python-headless>=4.10,<5"]
web = ["Flask>=3.1,<4", "waitress>=3.0,<4", "numpy>=1.26,<3", "opencv-python-headless>=4.10,<5"]
test = ["playwright>=1.50,<2"]

[project.scripts]
cu-diff = "cu_diff.cli:main"
cu-diff-web = "cu_diff.web:main"

[tool.setuptools.packages.find]
include = ["cu_diff*"]

[tool.setuptools.package-data]
cu_diff = ["static/*.html", "static/*.css", "static/*.js", "pricing/*.json"]
