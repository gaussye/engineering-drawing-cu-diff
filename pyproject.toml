[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "engineering-drawing-cu-diff"
version = "0.1.0"
description = "Evidence-grounded engineering drawing comparison with Azure Content Understanding"
requires-python = ">=3.11"
dependencies = ["PyMuPDF>=1.24,<2"]

[project.scripts]
cu-diff = "cu_diff.cli:main"

[tool.setuptools.packages.find]
include = ["cu_diff*"]
