<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>登录 · 工程图对比 Demo</title>
  <style>
    :root{color-scheme:light;--cp-bg:#f6f5f3;--cp-surface:#fff;--cp-text:#242424;--cp-text-muted:#6b6563;--cp-border:#dedad5;--cp-accent:#b11f4b;--cp-accent-fg:#fff}
    *{box-sizing:border-box}body{margin:0;background:var(--cp-bg);color:var(--cp-text);font-family:"Segoe UI","Microsoft YaHei",sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(900px,100%);display:grid;grid-template-columns:1.1fr 1fr;background:var(--cp-surface);border:1px solid var(--cp-border);box-shadow:0 24px 70px #30282112}
    .intro{padding:56px 40px;background:linear-gradient(90deg,#dedad540 1px,transparent 1px),linear-gradient(#dedad540 1px,transparent 1px),#f2efeb;background-size:24px 24px;border-right:1px solid var(--cp-border);display:flex;flex-direction:column;justify-content:space-between}
    .label{font:11px Consolas,monospace;letter-spacing:2px;color:var(--cp-text-muted)}h1{font-size:36px;line-height:1.35;letter-spacing:-1px;margin:32px 0 18px}p{font-size:14px;line-height:1.8;color:var(--cp-text-muted)}.mark{color:var(--cp-accent);font-size:30px}.foot{margin-top:56px;font-size:12px}
    .form{padding:56px 40px}h2{font-size:23px;margin:0 0 8px}form{margin-top:32px}label{display:block;font-size:13px;font-weight:600;margin:20px 0 8px}input{font:inherit;width:100%;padding:12px;border:1px solid var(--cp-border);border-radius:5px;background:white}input:focus{outline:2px solid var(--cp-accent);outline-offset:2px}
    button{width:100%;margin-top:26px;border:0;border-radius:5px;padding:13px;background:var(--cp-accent);color:var(--cp-accent-fg);font:600 15px "Segoe UI","Microsoft YaHei",sans-serif;cursor:pointer}button:hover{background:#95183e}button:focus-visible{outline:2px solid var(--cp-text);outline-offset:3px}.error{color:#a71938;background:#fff0f3;padding:12px;border-left:3px solid var(--cp-accent);font-size:13px}
    @media(max-width:650px){main{grid-template-columns:1fr}.intro{padding:28px;border-right:0;border-bottom:1px solid var(--cp-border)}h1{font-size:28px;margin:18px 0 8px}.foot{display:none}.form{padding:28px}}
  </style>
</head>
<body>
  <main>
    <section class="intro" aria-label="应用介绍">
      <div><span class="mark" aria-hidden="true">▥</span><div class="label">ENGINEERING / REVISION CHECK</div><h1>读懂变化。<br>回到图纸。</h1><p>双版本工程图对比<br>每一项差异，都关联原始证据。</p></div>
      <div class="foot">DEMO WORKSPACE · HTTPS 加密传输</div>
    </section>
    <section class="form">
      <span class="label">DEMO ACCESS</span><h2>登录演示环境</h2><p>使用管理员提供的固定用户名和密码。<br>无需 Microsoft 账号。</p>
      {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
      <form method="post" action="/login">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <label for="username">用户名</label><input id="username" name="username" autocomplete="username" maxlength="64" required autofocus>
        <label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required>
        <button type="submit">进入图纸对比 →</button>
      </form>
      <p>会话最长保留 8 小时。请勿公开分享账号，也勿上传未经授权的客户资料。</p>
    </section>
  </main>
</body>
</html>
